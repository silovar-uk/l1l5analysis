<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f2ea">
<meta name="description" content="論考を段落単位のL1〜L5抽象度と論証上の役割で保存するAnalysis Library。">
<title>Argument Altitude — Analysis Library</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<a class="skip" href="#outline">コンテンツへ</a>
<header class="topbar">
  <a class="brand" href="#/">Argument Altitude</a>
  <details class="tools-menu">
    <summary aria-label="ツールメニュー">•••</summary>
    <div class="tools-popover">
      <button id="importBtn" class="tool-btn" type="button">Import JSON</button>
      <button id="exportBtn" class="tool-btn" type="button">Export JSON</button>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
    </div>
  </details>
</header>
<main class="page" id="outline">
  <section id="hero"></section>
  <section id="structureMap" class="structure-map" aria-label="文章全体の構造"></section>
  <section id="structureSummary" class="structure-summary"></section>
  <div id="sections"></div>
  <section id="evaluation" class="evaluation" aria-label="文章の詳細な骨格評価"></section>
</main>
<button id="mapReturn" class="map-return" type="button" hidden aria-label="Structure Mapへ戻る">MAP ↑</button>
<script type="module" src="./app.js"></script>
</body>
</html>
